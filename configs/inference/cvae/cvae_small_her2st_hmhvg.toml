device = "cuda"

# [model] must match the trained checkpoint (cvae_small_her2st_hmhvg training config)
[model]
model            = "CVAE"
hidden_size      = 512
num_layers       = 3
latent_dim       = 64
cond_hidden_size = 256

[data]
slide_out          = "SPA148"
gene_list_filename = "selected_gene_list_hmhvg.txt"
data_path          = "/storage/hest1k/her2st/"

[sampling]
sample_num_per_cond = 20
seed                = 42
sampling_batch_size = 1024

[paths]
save_path = "/storage/hest1k/her2st/results/cvae_small_hmhvg/000/samples/"
ckpt      = "/storage/hest1k/her2st/results/cvae_small_hmhvg/000/checkpoints/0249830.pt"
