device = "cuda"

# [model] must match the trained checkpoint (cvae_large_her2st_hmhvg training config)
[model]
model            = "CVAE"
hidden_size      = 2210
num_layers       = 4
latent_dim       = 256
cond_hidden_size = 512

[data]
slide_out          = "SPA148"
gene_list_filename = "selected_gene_list_hmhvg.txt"
data_path          = "/storage/hest1k/her2st/"

[sampling]
sample_num_per_cond = 20
seed                = 42
sampling_batch_size = 1024

[paths]
save_path = "/storage/hest1k/her2st/results/cvae_large_hmhvg/000/samples/"
ckpt      = "/storage/hest1k/her2st/results/cvae_large_hmhvg/000/checkpoints/LAST.pt"  # set to the trained checkpoint
