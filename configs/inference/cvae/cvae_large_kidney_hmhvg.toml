device = "cuda"

# [model] must match the trained checkpoint (cvae_large_kidney_hmhvg training config)
[model]
model            = "CVAE"
hidden_size      = 2225
num_layers       = 4
latent_dim       = 256
cond_hidden_size = 512

[data]
slide_out          = "NCBI694"
gene_list_filename = "selected_gene_list_200_hmhvg.txt"
data_path          = "/storage/hest1k/kidney/"

[sampling]
sample_num_per_cond = 20
seed                = 42
sampling_batch_size = 1024

[paths]
save_path = "/storage/hest1k/kidney/results/cvae_large_200_hmhvg/000/samples/"
ckpt      = "/storage/hest1k/kidney/results/cvae_large_200_hmhvg/000/checkpoints/LAST.pt"  # set to the trained checkpoint
