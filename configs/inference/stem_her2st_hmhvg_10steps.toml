# Stem (DDPM) inference at 10 sampling steps — step-count benchmark variant (GPU).
# Same checkpoint as configs/inference/stem_her2st_hmhvg.toml (1000 steps);
# only num_sampling_steps and device differ. Outputs go to a separate
# benchmark dir so the other step-count samples are not overwritten.
device = "cuda"

[model]
model = "Stem"
DiT_num_blocks = 12
hidden_size = 384
num_heads = 6

[data]
slide_out = "SPA148"
gene_list_filename = "selected_gene_list_hmhvg.txt"
data_path = "/proj/berzelius-2025-380/storage/hest1k/her2st/"

[sampling]
sample_num_per_cond = 20
num_sampling_steps = 10
seed = 42
sampling_batch_size = 1024

[paths]
save_path = "/proj/berzelius-2025-380/storage/felipe/workspace/Stem_stomics/results/step_benchmark/stem_her2st_hmhvg_10/samples/"
ckpt = "/proj/berzelius-2025-380/storage/hest1k/her2st/results/runs_300_hmhvg/000/checkpoints/0223300.pt"
