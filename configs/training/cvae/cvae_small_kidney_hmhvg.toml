# Conditional VAE, "small" size — a natural-scale CVAE (~2.1M params),
# ~17x smaller than the parameter-matched "large" variant. Useful for
# checking whether the param-matched decoder is over-parameterized
# (over-capacity makes posterior collapse more likely).

[data]
data_path            = "/storage/hest1k/kidney/"
results_dir          = "/storage/hest1k/kidney/results/cvae_small_200_hmhvg/"
slide_out            = "NCBI694"
folder_list_filename = "all_slide_lst.txt"
gene_list_filename   = "selected_gene_list_200_hmhvg.txt"
num_aug_ratio        = 7

[model]
model            = "CVAE"
hidden_size      = 512
num_layers       = 3
latent_dim       = 64
cond_hidden_size = 256

[training]
lr                = 1e-4
total_epochs      = 316
global_batch_size = 256
global_seed       = 42
num_workers       = 1        # GPUs to run the job
ckpt_every        = 550
beta              = 1.0      # KL weight (1.0 = vanilla VAE)
grad_clip         = 1.0      # max global grad norm (<= 0 disables)
