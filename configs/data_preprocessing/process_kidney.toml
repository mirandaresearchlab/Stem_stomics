# Example TOML config for scripts/process_hest1k.py

# Processing mode: 'both', 'images', or 'genes'
# - 'both' (default): extract image embeddings and (optionally) run gene selection
# - 'images': extract only image embeddings (skips gene selection)
# - 'genes': skip image embedding extraction and run gene selection only
# process_mode = "both"
process_mode = "genes"

# error handling: if true, stop on first error; if false, continue and collect failures
halt_on_error = true

# Selection mode: 'list' or 'query'
selection_mode = "query"

# runtime
device = "cuda"

# embedding options
models_to_run = ["conch", "uni"]
save_augmented = true

# optional gene selection (only runs when process_mode is 'both' or 'genes')
run_gene_selection = true
hvg_top_k = 200   # set to 0 to skip HVG output
hmhvg_top_k = 200  # set to 0 to skip HMHVG output
deg_top_k = 0      # set >0 to enable DEG output; requires deg_groupby
gene_list_filename = "selected_gene_list_200.txt"  # customize output filename to avoid overwrites

# If selection_mode = 'list', provide ids_to_query or ids_file
ids_to_query = ["MEND65", "MISC3", "NCBI631"]

# dataset paths
[paths]
data_path = "/storage/hest1k"
tif_path = "/storage/hest1k/wsis"
st_path = "/storage/hest1k/st"
save_path = "/storage/hest1k/kidney"

# If selection_mode = 'query', provide an `ids_query` table. Example below uses a
# startswith(query) against the `dataset_title` column in the HEST metadata CSV.
[ids_query]
# csv_path can be a local path. If omitted, script will try to load the metadata CSV
# from HuggingFace at:
# https://huggingface.co/datasets/MahmoodLab/hest/resolve/main/HEST_v1_1_0.csv
csv_path = "/storage/hest1k/HEST_v1_1_0.csv"
column = "dataset_title"
method = "startswith"
pattern = "Spatial localization with Spatial Transcriptomics for an atlas of healthy and injured cell states"
# optional exact-match filters
#filters = { disease_state = "Healthy" }
