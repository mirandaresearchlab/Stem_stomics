[build-system]
requires = ["hatchling>=1.24"]          # lightweight PEP-517 backend
build-backend = "hatchling.build"

[project]
name            = "stem-stomics"
version         = "0.3.0"
description     = "Diffusion-based spatial transcriptomics models (STEM)."
requires-python = ">=3.11,<3.12"

dependencies = [
  # ── core ───────────────────────────────────────────
  "numpy==1.26.4",
  "pillow==10.4.0",
  "typing_extensions==4.11.0",
  "requests==2.32.3",
  "filelock==3.13.1",
  "jinja2==3.1.4",
  "pyyaml==6.0.1",
  "charset-normalizer>=3.0,<4.0",
  "idna>=3.5,<4.0",
  "urllib3>=2.2,<3.0",
  # ── maths / sci ────────────────────────────────────
  "mpmath==1.3.0",
  "sympy==1.12",
  "networkx==3.3",
  # ── misc ───────────────────────────────────────────
  "brotli==1.1.0",
  "dotenv>=0.9.9",
  "ipywidgets>=8.1.7",
  "pydantic>=2.9.2",
  "wandb>=0.21.0",
  # ── PyTorch (CUDA-12.1 wheels) ─────────────────────
  "torch==2.3.1+cu121",
  "torchvision==0.18.1+cu121",
  "torchaudio==2.3.1+cu121",
  # ── NVIDIA runtime wheels (ship the .so files) ────
  "nvidia-cuda-runtime-cu12", # libcudart.so.12
  "nvidia-cublas-cu12", # libcublas.so.12
  "nvidia-cusolver-cu12", # libcusolver.so.12
  "nvidia-cusparse-cu12", # libcusparse.so.12
  "nvidia-curand-cu12", # libcurand.so.10
  "nvidia-cuda-nvrtc-cu12", # libnvrtc.so.12
  "nvidia-nvjitlink-cu12", # libnvJitLink.so.12
  "nvidia-nvtx-cu12", # libnvToolsExt.so.1
  # cuDNN: stay on major-8 (PyTorch 2.3 links to libcudnn.so.8)
  "nvidia-cudnn-cu12<9",
  "ipykernel>=6.29.5",
  "tqdm>=4.67.1",
  "pandas>=2.3.1",
  "scanpy>=1.11.3",
  "anndata>=0.11.4",
  # "timm>=0.9.16,<0.10",
  # ── local packages ────────────────────────────────
  "uni",
  "conch",
  "jupyterlab>=4.5.0",
  "datasets>=4.4.1",
  "mygene>=3.2.2",
  "aiohttp>=3.10.10",
  "sentence-transformers>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "wheel>=0.43.0",
  "setuptools>=69.5.1",
]

[project.scripts]
stem-train  = "scripts.stem_train:_cli_entrypoint"
stem-sample = "scripts.stem_sample:_cli_entrypoint"

[tool.hatch.build]
packages = ["Stem", "settings", "scripts"]

[tool.hatch.build.targets.wheel]
include = [
  "assets/**",
  "configs/**",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu121"]
index-strategy  = "unsafe-best-match"

[tool.uv.sources]
uni = { path = "../UNI", editable = true }
conch = { path = "../CONCH", editable = true }
